naftiko: 1.0.0-alpha2
info:
  label: Granular Farm Management API — Financials
  description: 'Granular Farm Management API — Financials. 1 operations. Lead operation: Get farm financial summary. Self-contained
    Naftiko capability covering one Granular business surface.'
  tags:
  - Granular
  - Financials
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRANULAR_API_KEY: GRANULAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: farm-management-financials
    baseUri: https://api.granular.ag/v1
    description: Granular Farm Management API — Financials business capability. Self-contained, no shared references.
    resources:
    - name: financials-summary
      path: /financials/summary
      operations:
      - name: getfinancialsummary
        method: GET
        description: Get farm financial summary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: season
          in: query
          type: integer
          required: true
        - name: farmId
          in: query
          type: string
        - name: groupBy
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.GRANULAR_API_KEY}}'
  exposes:
  - type: rest
    namespace: farm-management-financials-rest
    port: 8080
    description: REST adapter for Granular Farm Management API — Financials. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/financials/summary
      name: financials-summary
      description: REST surface for financials-summary.
      operations:
      - method: GET
        name: getfinancialsummary
        description: Get farm financial summary
        call: farm-management-financials.getfinancialsummary
        with:
          season: rest.season
          farmId: rest.farmId
          groupBy: rest.groupBy
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: farm-management-financials-mcp
    port: 9090
    transport: http
    description: MCP adapter for Granular Farm Management API — Financials. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-farm-financial-summary
      description: Get farm financial summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: farm-management-financials.getfinancialsummary
      with:
        season: tools.season
        farmId: tools.farmId
        groupBy: tools.groupBy
      outputParameters:
      - type: object
        mapping: $.
