naftiko: 1.0.0-alpha2
info:
  label: Granular Farm Management API — Activities
  description: 'Granular Farm Management API — Activities. 1 operations. Lead operation: List field activities. Self-contained
    Naftiko capability covering one Granular business surface.'
  tags:
  - Granular
  - Activities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GRANULAR_API_KEY: GRANULAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: farm-management-activities
    baseUri: https://api.granular.ag/v1
    description: Granular Farm Management API — Activities business capability. Self-contained, no shared references.
    resources:
    - name: fields-fieldId-activities
      path: /fields/{fieldId}/activities
      operations:
      - name: listfieldactivities
        method: GET
        description: List field activities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fieldId
          in: path
          type: string
          required: true
        - name: season
          in: query
          type: integer
          description: Crop year to filter activities
        - name: activityType
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.GRANULAR_API_KEY}}'
  exposes:
  - type: rest
    namespace: farm-management-activities-rest
    port: 8080
    description: REST adapter for Granular Farm Management API — Activities. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/fields/{fieldid}/activities
      name: fields-fieldid-activities
      description: REST surface for fields-fieldId-activities.
      operations:
      - method: GET
        name: listfieldactivities
        description: List field activities
        call: farm-management-activities.listfieldactivities
        with:
          fieldId: rest.fieldId
          season: rest.season
          activityType: rest.activityType
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: farm-management-activities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Granular Farm Management API — Activities. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-field-activities
      description: List field activities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: farm-management-activities.listfieldactivities
      with:
        fieldId: tools.fieldId
        season: tools.season
        activityType: tools.activityType
      outputParameters:
      - type: object
        mapping: $.
