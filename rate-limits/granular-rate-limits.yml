description: >-
  Granular publishes NO rate limits and NO rate-limit response headers for any API. This file
  replaces a 2026-05-04 bulk-sweep scaffold that asserted five invented tiers (10/100/1000 rpm
  with X-RateLimit-* headers) that no Granular document has ever stated. There is no developer
  portal, no API reference, and no throttling documentation on any Granular or Corteva surface.
  No unauthenticated response could be observed either: the one live API front door,
  us.insights.granular.ag/api behind a Kong gateway, returns a bare
  '{"message":"no Route matched with those values"}' 404 with no RateLimit-*, X-RateLimit-* or
  Retry-After header. limit_count: 0 is a measured absence, not an unchecked field.
limit_count: 0
