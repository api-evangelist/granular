description: >-
  Granular publishes NO public pricing for any API. This file replaces a 2026-05-04 bulk-sweep
  scaffold that asserted three invented tiers (Free 1,000 req/mo, Professional 100,000 req/mo,
  Enterprise) with prices marked TBD — none of which Granular has ever published. Granular
  Insights is sold as a subscription through Corteva's agronomy sales motion; every public
  surface is a sign-in wall. The apex granular.ag 301-redirects to the Granular Insights SPA,
  which renders nothing without credentials, and Corteva's sitemap carries no Granular pricing
  page. There is no developer plan, no API price list, and no self-serve API tier to record.
